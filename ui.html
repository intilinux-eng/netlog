<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netlog</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2330; --muted: #5d6778;
    --line: #e1e5ec; --warn-bg: #fff4e5; --warn-line: #e8a33d; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #98a2b3;
      --line: #2b3240; --warn-bg: #33270f; --warn-line: #c98a2b; --accent: #7aa7ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.875rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; }
  .warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .who { font-weight: 600; overflow-wrap: anywhere; }
  ul { margin: 8px 0 0; padding-left: 20px; }
  li { margin: 2px 0; overflow-wrap: anywhere; }
  li b { font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 data-t="title"></h1>
  <div class="muted small" id="status">…</div>

  <h2 data-t="hAlerts"></h2>
  <div id="alerts"></div>

  <h2 data-t="hNews"></h2>
  <div id="news"></div>

  <h2 data-t="hPrograms"></h2>
  <div id="programs"></div>

  <h2 data-t="hListening"></h2>
  <div id="listening"></div>

  <h2 data-t="hDevices"></h2>
  <div id="devices"></div>
</main>
<script>
// Testi fissi della pagina nelle due lingue. Le frasi degli eventi arrivano già tradotte da netlog.
const TEXT = {
  it: {
    title: "Cosa succede sulla tua rete",
    hAlerts: "Da controllare", hNews: "Novità rispetto alle volte precedenti",
    hPrograms: "Chi sta usando la rete", hListening: "Programmi che accettano connessioni",
    hDevices: "Dispositivi visti in rete",
    at: "alle ", noAlerts: "Niente di strano finora.", noNews: "Nessuna novità.",
    signing: "Firma in verifica", signedBy: "Firmato da ", unsigned: "Nessuna firma digitale valida",
    talked: (n, up, down) => `Ha parlato con ${n} ${n === 1 ? "destinazione" : "destinazioni"}: ` +
                             `${up} inviati, ${down} ricevuti.`,
    noTraffic: "Ancora nessun traffico osservato.",
    fromLan: "Raggiungibile dagli altri dispositivi della rete, se il firewall lo permette",
    localOnly: "Raggiungibile solo da questo PC",
    ports: n => n === 1 ? "porta" : "porte",
    noListening: "Nessun programma in ascolto (o analisi di un file salvato).",
    firstSeen: "visto la prima volta alle ", noDevices: "Nessun altro dispositivo visto finora.",
    updated: "Aggiornato alle ", offline: "netlog non risponde: è ancora in esecuzione?",
  },
  en: {
    title: "What is happening on your network",
    hAlerts: "Worth checking", hNews: "New since the previous runs",
    hPrograms: "Who is using the network", hListening: "Programs accepting connections",
    hDevices: "Devices seen on the network",
    at: "at ", noAlerts: "Nothing unusual so far.", noNews: "Nothing new.",
    signing: "Checking signature", signedBy: "Signed by ", unsigned: "No valid digital signature",
    talked: (n, up, down) => `Talked to ${n} ${n === 1 ? "destination" : "destinations"}: ` +
                             `${up} sent, ${down} received.`,
    noTraffic: "No traffic observed yet.",
    fromLan: "Reachable from other devices on the network, if the firewall allows it",
    localOnly: "Reachable only from this PC",
    ports: n => n === 1 ? "port" : "ports",
    noListening: "No program is listening (or a saved file is being analyzed).",
    firstSeen: "first seen at ", noDevices: "No other device seen so far.",
    updated: "Updated at ", offline: "netlog is not responding: is it still running?",
  },
};
let T = TEXT.it;

// Nomi di siti e programmi arrivano dalla rete: si inseriscono sempre con textContent, mai come HTML.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function bytes(n) {
  const units = ["B", "kB", "MB", "GB"];
  let i = 0;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return (i ? n.toFixed(1) : n) + " " + units[i];
}
function time(iso) { return iso.slice(11, 19); }
function fill(id, nodes, emptyText) {
  const box = document.getElementById(id);
  box.replaceChildren(...(nodes.length ? nodes : [el("div", "muted", emptyText)]));
}

function render(state) {
  T = TEXT[state.lingua];
  document.documentElement.lang = state.lingua;
  for (const e of document.querySelectorAll("[data-t]")) e.textContent = T[e.dataset.t];

  const alerts = state.eventi.filter(e => e.tipo === "avviso").reverse();
  fill("alerts", alerts.map(a => {
    const c = el("div", "card warn");
    c.append(el("div", "", a.testo), el("div", "muted small", T.at + time(a.ora)));
    return c;
  }), T.noAlerts);

  const news = state.eventi.filter(e => e.tipo === "novita").reverse();
  fill("news", news.map(a => {
    const c = el("div", "card");
    c.append(el("div", "", a.testo), el("div", "muted small", T.at + time(a.ora)));
    return c;
  }), T.noNews);

  fill("programs", state.programmi.map(p => {
    const c = el("div", "card");
    const n = p.contatti.length;
    c.append(el("div", "who", p.chi));
    if (p.percorso) {
      const signed = p.firma === null ? T.signing : p.firma ? T.signedBy + p.firma : T.unsigned;
      c.append(el("div", "muted small", `${signed} · ${p.percorso}`));
    }
    c.append(
      el("div", "muted small", T.talked(n, bytes(p.inviati), bytes(p.ricevuti))));
    const list = el("ul");
    for (const k of p.contatti) {
      const li = el("li");
      li.append(el("b", "", k.con), ` — ${k.servizio} · ${bytes(k.inviati + k.ricevuti)}`);
      list.append(li);
    }
    c.append(list);
    return c;
  }), T.noTraffic);

  // Raggruppa per programma: chi è raggiungibile dalla rete viene prima ed è evidenziato.
  const byProgram = new Map();
  for (const l of state.in_ascolto) {
    const key = l.chi + "|" + l.dalla_rete;
    if (!byProgram.has(key)) byProgram.set(key, {chi: l.chi, dalla_rete: l.dalla_rete, porte: []});
    byProgram.get(key).porte.push(l.servizio ? `${l.porta} (${l.servizio})` : String(l.porta));
  }
  fill("listening", [...byProgram.values()].map(g => {
    const c = el("div", g.dalla_rete ? "card warn" : "card");
    const n = g.porte.length;
    c.append(
      el("div", "who", g.chi),
      el("div", "muted small",
         (g.dalla_rete ? T.fromLan : T.localOnly) + ` · ${T.ports(n)} ${g.porte.join(", ")}`));
    return c;
  }), T.noListening);

  const devices = state.eventi.filter(e => e.tipo === "dispositivo");
  fill("devices", devices.map(d => {
    const c = el("div", "card");
    c.append(el("div", "", d.dettaglio), el("div", "muted small", T.firstSeen + time(d.ora)));
    return c;
  }), T.noDevices);
}

async function refresh() {
  const status = document.getElementById("status");
  try {
    render(await (await fetch("/api/state")).json());
    status.textContent = T.updated + new Date().toLocaleTimeString(document.documentElement.lang);
  } catch {
    status.textContent = T.offline;
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>

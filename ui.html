<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netlog</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2330; --muted: #5d6778;
    --line: #e1e5ec; --warn-bg: #fff4e5; --warn-line: #e8a33d; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #98a2b3;
      --line: #2b3240; --warn-bg: #33270f; --warn-line: #c98a2b; --accent: #7aa7ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.875rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; }
  .warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .who { font-weight: 600; overflow-wrap: anywhere; }
  ul { margin: 8px 0 0; padding-left: 20px; }
  li { margin: 2px 0; overflow-wrap: anywhere; }
  li b { font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Cosa succede sulla tua rete</h1>
  <div class="muted small" id="status">Caricamento…</div>

  <h2>Da controllare</h2>
  <div id="alerts"></div>

  <h2>Novità rispetto alle volte precedenti</h2>
  <div id="news"></div>

  <h2>Chi sta usando la rete</h2>
  <div id="programs"></div>

  <h2>Programmi che accettano connessioni</h2>
  <div id="listening"></div>

  <h2>Dispositivi visti in rete</h2>
  <div id="devices"></div>
</main>
<script>
// Nomi di siti e programmi arrivano dalla rete: si inseriscono sempre con textContent, mai come HTML.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function bytes(n) {
  const units = ["B", "kB", "MB", "GB"];
  let i = 0;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return (i ? n.toFixed(1) : n) + " " + units[i];
}
function time(iso) { return iso.slice(11, 19); }
function fill(id, nodes, emptyText) {
  const box = document.getElementById(id);
  box.replaceChildren(...(nodes.length ? nodes : [el("div", "muted", emptyText)]));
}

function render(state) {
  const alerts = state.eventi.filter(e => e.tipo === "avviso").reverse();
  fill("alerts", alerts.map(a => {
    const c = el("div", "card warn");
    c.append(el("div", "", a.testo), el("div", "muted small", "alle " + time(a.ora)));
    return c;
  }), "Niente di strano finora.");

  const news = state.eventi.filter(e => e.tipo === "novita").reverse();
  fill("news", news.map(a => {
    const c = el("div", "card");
    c.append(el("div", "", a.testo), el("div", "muted small", "alle " + time(a.ora)));
    return c;
  }), "Nessuna novità.");

  fill("programs", state.programmi.map(p => {
    const c = el("div", "card");
    const n = p.contatti.length;
    c.append(el("div", "who", p.chi));
    if (p.percorso) {
      const signed = p.firma === null ? "Firma in verifica"
                   : p.firma ? "Firmato da " + p.firma : "Nessuna firma digitale valida";
      c.append(el("div", "muted small", `${signed} · ${p.percorso}`));
    }
    c.append(
      el("div", "muted small",
         `Ha parlato con ${n} ${n === 1 ? "destinazione" : "destinazioni"}: ` +
         `${bytes(p.inviati)} inviati, ${bytes(p.ricevuti)} ricevuti.`));
    const list = el("ul");
    for (const k of p.contatti) {
      const li = el("li");
      li.append(el("b", "", k.con), ` — ${k.servizio} · ${bytes(k.inviati + k.ricevuti)}`);
      list.append(li);
    }
    c.append(list);
    return c;
  }), "Ancora nessun traffico osservato.");

  // Raggruppa per programma: chi è raggiungibile dalla rete viene prima ed è evidenziato.
  const byProgram = new Map();
  for (const l of state.in_ascolto) {
    const key = l.chi + "|" + l.dalla_rete;
    if (!byProgram.has(key)) byProgram.set(key, {chi: l.chi, dalla_rete: l.dalla_rete, porte: []});
    byProgram.get(key).porte.push(l.servizio ? `${l.porta} (${l.servizio})` : String(l.porta));
  }
  fill("listening", [...byProgram.values()].map(g => {
    const c = el("div", g.dalla_rete ? "card warn" : "card");
    const n = g.porte.length;
    c.append(
      el("div", "who", g.chi),
      el("div", "muted small",
         (g.dalla_rete
            ? "Raggiungibile dagli altri dispositivi della rete, se il firewall lo permette"
            : "Raggiungibile solo da questo PC") +
         ` · ${n === 1 ? "porta" : "porte"} ${g.porte.join(", ")}`));
    return c;
  }), "Nessun programma in ascolto (o analisi di un file salvato).");

  const devices = state.eventi.filter(e => e.tipo === "dispositivo");
  fill("devices", devices.map(d => {
    const c = el("div", "card");
    c.append(el("div", "", d.testo.replace("Dispositivo visto in rete: ", "")),
             el("div", "muted small", "visto la prima volta alle " + time(d.ora)));
    return c;
  }), "Nessun altro dispositivo visto finora.");
}

async function refresh() {
  const status = document.getElementById("status");
  try {
    render(await (await fetch("/api/state")).json());
    status.textContent = "Aggiornato alle " + new Date().toLocaleTimeString("it-IT");
  } catch {
    status.textContent = "netlog non risponde: è ancora in esecuzione?";
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
